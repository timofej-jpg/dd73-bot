<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FishStats WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🐟 FishStats</h2>
        <p>Выбери тип рыбы и введи вес:</p>
        
        <label for="fish">Вид рыбы:</label>
        <select id="fish">
            <option value="Окунь">Окунь</option>
            <option value="Судак">Судак</option>
            <option value="Щука">Щука</option>
            <option value="Карп">Карп</option>
            <option value="Карась">Карась</option>
        </select>

        <label for="weight">Вес (кг):</label>
        <input type="number" id="weight" step="0.1" placeholder="Например: 1.5">

        <button id="sendBtn">Сохранить улов</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
