<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FishStats Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="app-shell">

        <!-- 1. КАРТА (На весь экран) -->
        <div id="tab-map" class="tab-view active">
            <div id="map-container">
                <button class="map-float-btn" onclick="locateUser()">🎯 Мое местоположение</button>
                <div id="map"></div>
            </div>
        </div>

        <!-- 2. ПРОГНОЗ КЛЕВАИ ПОГОДЫ -->
        <div id="tab-forecast" class="tab-view">
            <!-- ПАНЕЛЬ ВЫБРАННОЙ ТОЧКИ -->
            <div class="selected-location-bar">
                <span>📍 Точка прогноза: <b class="loc-display" style="color: var(--accent-cyan);">Фонтанка / Одесса</b></span>
                <small style="color: var(--text-sub);">(нажмите на карту для смены)</small>
            </div>

            <div class="sub-nav">
                <button class="sub-btn active" onclick="switchSubForecast('bite', this)">🎣 Активность</button>
                <button class="sub-btn" onclick="switchSubForecast('weather', this)">🌤 Погода и Ветер</button>
            </div>

            <div id="sub-bite" class="sub-content">
                <div class="glass-box" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size: 12px; color: var(--text-sub);">Индекс клева для точки</div>
                        <div style="font-size: 18px; font-weight:700; color:#fff; margin-top:2px;">Благоприятно</div>
                    </div>
                    <div style="font-size:26px; font-weight:800; color:var(--accent-cyan);" id="bite-val">80%</div>
                </div>
            </div>

            <div id="sub-weather" class="sub-content hidden">
                <div class="glass-box">
                    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; text-align:center;">
                        <div>Температура<br><b id="val-temp" style="color:#fff;">--°C</b></div>
                        <div>Ветер<br><b id="val-wind" style="color:#fff;">-- км/ч</b></div>
                        <div>Давление<br><b id="val-press" style="color:#fff;">-- мм</b></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. ПРЕМИУМ И ОПЛАТА -->
        <div id="tab-premium" class="tab-view">
            <div class="glass-box" style="text-align:center;">
                <h2 style="font-size:20px; color:var(--accent-gold);">⭐ PRO Подписка</h2>
                <p style="font-size:12px; color:var(--text-sub); margin-top:6px;">Полный доступ к изобатам глубин и эхолоту</p>
                
                <button class="action-btn" onclick="buyProSubscription()">⭐ Купить PRO (500 Telegram Stars)</button>
            </div>
        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-bar-wrapper">
            <nav class="bottom-bar">
                <button class="nav-item active" onclick="switchMainTab('tab-map', this)"><span>🌐</span>Карта</button>
                <button class="nav-item" onclick="switchMainTab('tab-forecast', this)"><span>📈</span>Прогноз</button>
                <button class="nav-item" onclick="switchMainTab('tab-premium', this)"><span>⭐</span>Премиум</button>
            </nav>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
